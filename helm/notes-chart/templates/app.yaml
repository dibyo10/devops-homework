apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-page
data:
  index.html: {{ printf "<h1>%s</h1><p>%s</p>" (.Values.message | html) (.Values.environment | html) | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
      annotations:
        config: {{ printf "%s:%s" .Values.message .Values.environment | sha256sum | quote }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.image }}
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts: [{name: page, mountPath: /usr/share/nginx/html}]
      volumes:
        - name: page
          configMap: {name: {{ .Release.Name }}-page}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: {app: {{ .Release.Name }}}
  ports: [{port: 80, targetPort: 80}]
