apiVersion: v1
kind: Pod
metadata: {name: load-generator, namespace: hw-storage}
spec:
  containers:
    - name: load
      image: busybox:1.37
      command: [sh, -c, "for i in 1 2 3 4 5 6 7 8; do (while true; do wget -q -O /dev/null http://hpa-demo; done) & done; wait"]
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 100m, memory: 32Mi}
