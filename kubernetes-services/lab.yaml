apiVersion: v1
kind: Namespace
metadata:
  name: hw-services
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  namespace: hw-services
spec:
  serviceName: headless
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          command: ["sh", "-c", "echo 'Dibyo Chakraborty 24BCS10302' > /usr/share/nginx/html/index.html; exec nginx -g 'daemon off;'"]
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: hw-services
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Service
metadata:
  name: clusterip
  namespace: hw-services
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nodeport
  namespace: hw-services
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: loadbalancer
  namespace: hw-services
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 8088
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: headless
  namespace: hw-services
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: externalname
  namespace: hw-services
spec:
  type: ExternalName
  externalName: clusterip.hw-services.svc.cluster.local
