apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-readiness
  namespace: hw-workloads
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 20; touch /tmp/ready; sleep 3600"]
      readinessProbe:
        exec:
          command: ["test", "-f", "/tmp/ready"]
        periodSeconds: 2
