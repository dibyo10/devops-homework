apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-liveness
  namespace: hw-workloads
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "touch /tmp/healthy; sleep 20; rm /tmp/healthy; sleep 3600"]
      livenessProbe:
        exec:
          command: ["test", "-f", "/tmp/healthy"]
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 2
