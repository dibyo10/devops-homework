apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-multi-container
  namespace: hw-workloads
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "mkdir -p /www; echo shared-pod-network > /www/index.html; httpd -f -p 8080 -h /www"]
    - name: sidecar
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3; wget -S -O- http://127.0.0.1:8080; sleep 3600"]
