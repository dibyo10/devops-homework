{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "volume",
    "namespace": "hw-troubleshooting"
  },
  "spec": {
    "volumes": [
      {
        "name": "settings",
        "configMap": {
          "name": "missing-volume"
        }
      }
    ],
    "containers": [
      {
        "name": "app",
        "image": "busybox:1.37",
        "command": [
          "sleep",
          "3600"
        ],
        "volumeMounts": [
          {
            "name": "settings",
            "mountPath": "/settings"
          }
        ]
      }
    ]
  }
}
