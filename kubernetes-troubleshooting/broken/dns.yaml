{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "dns",
    "namespace": "hw-troubleshooting"
  },
  "spec": {
    "dnsPolicy": "None",
    "dnsConfig": {
      "nameservers": [
        "192.0.2.1"
      ]
    },
    "containers": [
      {
        "name": "app",
        "image": "busybox:1.37",
        "command": [
          "sleep",
          "3600"
        ]
      }
    ]
  }
}
