services:
  frontend:
    image: nginx:1.29-alpine
    container_name: homework-frontend
    ports:
      - "8087:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - frontend-network

  backend:
    image: nginx:1.29-alpine
    container_name: homework-backend
    volumes:
      - ./backend:/usr/share/nginx/html:ro
    networks:
      - frontend-network
      - backend-network

  database:
    image: mysql:8.4
    container_name: homework-database
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-devops-local-only}"
    networks:
      - backend-network
      - database-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-devops-local-only}"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  frontend-network:
  backend-network:
  database-network:
